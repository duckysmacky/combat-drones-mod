plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.9'
    id 'com.gradleup.shadow' version '8.3.8'
}

version = mod_version
group = 'io.github.duckysmacky.combatdrones'
base {
    archivesName.set('combat_drones')
}

java {
    toolchain {
        // Compile and run Minecraft on JDK 8 regardless of the JDK running Gradle
        languageVersion.set(JavaLanguageVersion.of(8))
    }
}

minecraft {
    mcVersion.set('1.12.2')
    mcpMappingChannel.set('stable')
    mcpMappingVersion.set('39')
    username.set('Developer')
    extraRunJvmArguments.add('-ea:io.github.duckysmacky.combatdrones')
}

configurations {
    // Libraries bundled (and relocated) into the mod jar; MC 1.12 doesn't ship them
    shade
    implementation.extendsFrom shade
}

repositories {
    maven {
        name 'CleanroomMC Maven'
        url 'https://maven.cleanroommc.com'
    }
    maven {
        name 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
}

dependencies {
    shade 'com.electronwill.night-config:toml:3.6.7'

    // Entity/item model rendering (client side only, see client/GeoModels)
    implementation rfg.deobf('software.bernie.geckolib:geckolib-forge-1.12.2:3.0.31')

    // Dev-env only: stops Forge 2860 refusing to load next to newer-Forge-only checks
    runtimeOnly 'com.cleanroommc:strip-latest-forge-requirements:1.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', version
    filesMatching('mcmod.info') {
        expand 'version': version, 'mcversion': '1.12.2'
    }
}

// Relocate so another mod bundling night-config can't clash, then reobfuscate the shaded jar instead of the plain one
tasks.shadowJar {
    configurations = [project.configurations.shade]
    archiveClassifier.set('shaded')
    relocate 'com.electronwill.nightconfig', 'io.github.duckysmacky.combatdrones.shadow.nightconfig'
}
tasks.named('reobfJar').configure {
    inputJar.set(tasks.named('shadowJar').flatMap { it.archiveFile })
}
