name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            21

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew build
        env:
          ORG_GRADLE_PROJECT_org.gradle.java.installations.fromEnv: JAVA_HOME_8_X64

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "build/libs/combat_drones-${GITHUB_REF_NAME#v}.jar"
          --draft --generate-notes --title "$GITHUB_REF_NAME"
